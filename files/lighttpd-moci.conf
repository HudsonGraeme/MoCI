server.modules += ( "mod_alias", "mod_cgi", "mod_setenv" )

$HTTP["url"] =~ "^/moci/" {
    alias.url = ( "/moci/" => "/www/moci/" )
    index-file.names = ( "index.html" )
}

$HTTP["url"] == "/ubus" {
    alias.url = ( "/ubus" => "/www/moci/ubus.cgi" )
    cgi.assign = ( ".cgi" => "" )
    setenv.add-environment = ( "PATH" => "/usr/bin:/usr/sbin:/bin:/sbin" )
}
